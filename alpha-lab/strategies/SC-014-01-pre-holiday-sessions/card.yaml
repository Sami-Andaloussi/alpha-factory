id: SC-014-01-pre-holiday-sessions
theory: SC-014
parent: null
mechanism: >
  Before the exchange closes for a holiday, short sellers cover and positions are unwound,
  individuals' buy orders build up and market makers adjust their inventories, in a mood of holiday
  optimism: the session before a market-closing holiday earns more than an ordinary session, though
  the effect has weakened since it became known and may have moved to the third session before.
prediction:
  sign: positive
  size: a judgment, from the sources -- the three US funds' pre-holiday session about 0 to +0.08% a day above the other sessions, more in IWM than in SPY, EFA and EEM about 0, the five funds' average about 0 to +0.05%; the third session before about 0 to +0.20% above the other sessions for the US funds; the base's alpha about 0 to 0.45% a year before costs of about 0.9% a year, an appraisal ratio of about 0 to 0.11 before costs; the base and the variant expected to fail gate 2
universe: [SPY, QQQ, IWM, EFA, EEM]
horizon: days
signal: >
  Sessions are placed on the New York Stock Exchange's calendar of scheduled sessions, derived from
  its holiday rules alone and read from no price: weekdays less New Year's Day (on 2 January when 1
  January is a Sunday, not observed when it is a Saturday), Martin Luther King Jr. Day, Washington's
  Birthday, Good Friday, Memorial Day, Juneteenth from 2022, Independence Day, Labor Day,
  Thanksgiving and Christmas, with Juneteenth, Independence Day and Christmas moved to the Friday
  before when they fall on a Saturday and to the Monday after when on a Sunday. For each of those
  holidays that falls on a weekday, the scheduled session offset sessions before it, 1 the last
  scheduled session before it, is held. On each session of the market, from the first, the target is
  the five funds in equal parts, among those that trade, if the next scheduled session is held, and
  nothing, the bill's rate on cash, otherwise; a target is set only on the sessions on which it
  changes, and on the first. A scheduled session on which the exchange does not open is counted as
  the calendar counts it and is absent from the market.
parameters:
  offset: which scheduled session before each weekday holiday is held, 1 the last before it
variants:
  - {offset: 1}
  - {offset: 3}
neighbours:
  offset: {25: [2], 50: [2]}
choose: false
splits:
  in_sample: [2005-01-01, 2022-12-31]
  holdout: [2023-01-01, 2025-12-31]
refuted_if: >
  Judged before costs: over the in-sample sessions from the base's first held, the three US funds'
  (SPY, QQQ, IWM) average daily return less the bill's rate, each from the market's previous close;
  the mean over the sessions whose return spans the last scheduled session before one of the
  signal's scheduled holidays that falls on a weekday, less the mean over the other sessions, with
  the standard error of that difference, the square root of the sum of each group's variance over
  its count, and its t statistic, computed apart from the battery. The theory is refuted in this
  form if that t statistic is -0.35 or below. Above it, short of passing gates 1 to 7, it is not
  proven, not refuted; a base that passes gates 1 to 7 while the clause refutes leaves the theory
  refuted in this form. Of SC-014's refutation criteria the first is graded, the second and fourth
  reported, the third partly read through the session after the holiday, the fifth beyond the lab's
  data. Reported, not graded, each gap with the standard error from the two groups' variances, for
  the three US funds' average unless stated: the same gap for each fund, for the five funds' average
  and for IWM less SPY; the gap of the sessions -3, -2, +1 and +2 around each holiday, each placed
  by the market session whose return spans the scheduled session and set against all the sessions
  outside its group, a session in two groups counted in both, for the US funds' average, the five
  funds' and IWM, and the -3 gap over 2012-2022 for the same three; the gap of the sessions before
  Columbus Day (the second Monday of October) and Veterans Day (11 November when a weekday), and the
  pre-holiday gap less it; the pre-holiday gap inside SC-008-01's span from -5 to +2, against the
  span's other sessions, and outside it, against the other sessions outside, and the pre-holiday
  Fridays against the other Fridays; the pre-holiday gap without the pre-holiday sessions of
  Christmas and New Year's Day, and by holiday; the gap over 2005-2011 and 2012-2022; the base's and
  the variant's alphas before and after costs, and the neighbour's and the one-day-late rule's
  alphas and appraisal ratios.
